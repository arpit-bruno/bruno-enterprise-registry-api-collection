info:
  name: Who am I after sign out
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/whoami"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
