info:
  name: Create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/artifacts"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "type": "collection",
        "owner": "{{org}}",
        "login": "api-check-{{process.env.MY_NAME}}",
        "name": "API check"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Answers 409 if it already exists. Run Delete first in that case.
