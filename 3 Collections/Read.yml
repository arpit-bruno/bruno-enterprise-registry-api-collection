info:
  name: Read
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/artifacts/{{org}}/api-check-{{process.env.MY_NAME}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: "API check"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
