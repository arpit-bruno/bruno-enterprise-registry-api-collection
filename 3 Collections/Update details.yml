info:
  name: Update details
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/artifacts/{{org}}/api-check-{{process.env.MY_NAME}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "description": "Checked from Bruno"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.description
      operator: eq
      value: "Checked from Bruno"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
