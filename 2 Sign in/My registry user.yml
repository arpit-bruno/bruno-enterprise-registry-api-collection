info:
  name: My registry user
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/me"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Shows the role. With make up-lm everyone is an admin.
