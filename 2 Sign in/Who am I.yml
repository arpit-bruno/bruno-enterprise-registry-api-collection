info:
  name: Who am I
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/whoami"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  The session the registry made at sign-in.
