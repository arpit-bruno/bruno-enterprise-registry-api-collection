info:
  name: Sign in with the licence token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "licenseToken": "{{process.env.LICENSE_TOKEN}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.login
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  The registry sends the token to License Manager. If it is valid, the registry starts its own session and sets a cookie.
