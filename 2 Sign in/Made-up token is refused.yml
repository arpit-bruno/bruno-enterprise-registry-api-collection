info:
  name: Made-up token is refused
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "licenseToken": "eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiJhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWEiLCJlbWFpbCI6Im5vYm9keUBleGFtcGxlLnRlc3QiLCJkZXZpY2VJZCI6IngifQ.not-a-real-signature"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  The registry asks License Manager, which does not know this token.
